spring:
  application:
    name: rabbit-playground
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

server:
  port: 8080

playground:
  queue:
    name: playground.queue

logging:
  level:
    com.orderflow: DEBUG
